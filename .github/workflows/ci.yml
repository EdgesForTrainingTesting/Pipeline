name: Task Management CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'ui-tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  ALLURE_VERSION: '2.24.0'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.filter.outputs.app }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Changed files:"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA"

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(app/|\.github/workflows/)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(ui-tests/|\.github/workflows/)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  build_app:
    name: Build Application
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Show tool versions
        run: |
          java -version
          mvn -version

      - name: Compile application
        working-directory: app
        run: mvn -B clean compile -DskipTests

      - name: Package application
        working-directory: app
        run: mvn -B package -DskipTests

      - name: Upload application JAR
        uses: actions/upload-artifact@v7
        with:
          name: application-jar
          path: app/target/*.jar
          if-no-files-found: error
          retention-days: 1

  unit_tests:
    name: Unit Tests
    needs:
      - changes
      - build_app
    if: ${{ always() && needs.changes.outputs.app == 'true' && needs.build_app.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: app/pom.xml

      - name: Run unit tests
        working-directory: app
        run: mvn -B test

      - name: Upload unit test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            app/target/surefire-reports/
            app/target/allure-results/
          if-no-files-found: warn
          retention-days: 7

  ui_tests:
    name: UI Tests
    needs:
      - changes
      - build_app
      - unit_tests
    if: >-
      ${{
        always() &&
        needs.changes.result == 'success' &&
        (needs.changes.outputs.app == 'true' || needs.changes.outputs.ui == 'true') &&
        (needs.changes.outputs.app != 'true' || needs.build_app.result == 'success') &&
        (needs.changes.outputs.app != 'true' || needs.unit_tests.result == 'success')
      }}
    runs-on: ubuntu-24.04
    env:
      APP_BASE_URL: http://127.0.0.1:8080/index.html
      CHROME_BIN: /usr/bin/google-chrome
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: ui-tests/pom.xml

      - name: Show browser versions
        run: |
          google-chrome --version
          chromedriver --version

      - name: Start static application server
        shell: bash
        run: |
          cd app/src/main/resources/static
          python3 -m http.server 8080 > "$RUNNER_TEMP/http-server.log" 2>&1 &

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/index.html > /dev/null; then
              echo "Static UI is ready"
              exit 0
            fi
            sleep 1
          done

          echo "Static UI failed to start"
          cat "$RUNNER_TEMP/http-server.log" || true
          exit 1

      - name: Run Selenium UI tests
        working-directory: ui-tests
        run: mvn -B test

      - name: Upload UI test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: |
            ui-tests/target/surefire-reports/
            ui-tests/target/allure-results/
            ui-tests/target/screenshots/
          if-no-files-found: warn
          retention-days: 7

  generate_allure_report:
    name: Generate Allure Report
    needs:
      - changes
      - unit_tests
      - ui_tests
    if: ${{ always() && (needs.changes.outputs.app == 'true' || needs.changes.outputs.ui == 'true') }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download test result artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: '*-test-results'
          path: downloaded-results

      - name: Install Allure CLI
        shell: bash
        run: |
          curl -fsSL \
            "https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/${ALLURE_VERSION}/allure-commandline-${ALLURE_VERSION}.tgz" \
            -o allure.tgz
          tar -xzf allure.tgz
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Combine results and generate Allure HTML
        shell: bash
        run: |
          mkdir -p combined-allure-results allure-report

          if [ -d downloaded-results ]; then
            find downloaded-results -type f -path '*/allure-results/*' -exec cp {} combined-allure-results/ \;
          fi

          if [ -n "$(ls -A combined-allure-results 2>/dev/null)" ]; then
            allure generate combined-allure-results --clean -o allure-report
          else
            cat > allure-report/index.html <<'EOF'
          <!doctype html>
          <html>
            <body>
              <h1>No Allure results were produced</h1>
              <p>Check the Build, Unit Tests, and UI Tests jobs.</p>
            </body>
          </html>
          EOF
          fi

      - name: Upload Allure HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 30

  pipeline_summary:
    name: Pipeline Summary
    needs:
      - changes
      - build_app
      - unit_tests
      - ui_tests
      - generate_allure_report
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Write summary
        shell: bash
        run: |
          {
            echo "# Task Management CI Summary"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Detect Changes | ${{ needs.changes.result }} |"
            echo "| Build Application | ${{ needs.build_app.result }} |"
            echo "| Unit Tests | ${{ needs.unit_tests.result }} |"
            echo "| UI Tests | ${{ needs.ui_tests.result }} |"
            echo "| Allure Report | ${{ needs.generate_allure_report.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
