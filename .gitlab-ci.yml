# ========================================================
# TASK MANAGEMENT SYSTEM - GITLAB CI/CD PIPELINE
# ========================================================

default:
  image: maven:3.9-eclipse-temurin-17  # Docker container: Java 17 + Maven 3.9 for ALL jobs
  cache:                               # Cache Maven dependencies between pipeline runs
    key: ${CI_PROJECT_ID}              # Unique cache per project (shared across branches)
    paths:
      - .m2/repository                 # Maven local repository (~500MB speedup)
  before_script:                       # Execute BEFORE every job's script section
    - echo "Pipeline started for commit ${CI_COMMIT_SHORT_SHA}"  # Log commit info
    - echo "Triggered by ${CI_COMMIT_AUTHOR}"                    # Log author

variables:                             # Global environment variables for all jobs
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"  # Force Maven to use project-local repo
  ALLURE_VERSION: "2.24.0"             # Version of Allure report generator

# ==================== PIPELINE SCOPE ====================
# Controls WHEN the entire pipeline runs
workflow:
  rules:
    # Run pipelines only for merge requests (no pipelines on plain pushes)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'  # Trigger condition: MR events only
      when: always                                        # Execute pipeline
    - when: never                                         # Block all other triggers (branches/tags/pushes)

stages:
  - build                            # Stage 1: Compile application
  - unit_test                        # Stage 2: Backend unit tests
  - ui_test                          # Stage 3: Frontend UI tests (Selenium)
  - allure_report                    # Stage 4: Generate test reports

# ==================== BUILD STAGE ====================
# Builds production JAR - runs only when app code changes
build_app:
  stage: build                       # Assign to 'build' stage
  script:
    - echo "🏗️  Building Task Management System..."  # Log start
    - cd app                             # Enter app directory
    - mvn -B clean compile -DskipTests   # Clean compile (batch mode, skip tests)
    - mvn -B package -DskipTests         # Package JAR (batch mode, skip tests)
    - echo "✅ Build completed successfully"  # Log success
  artifacts:
    paths:
      - app/target/*.jar                # Save compiled JAR for later jobs
    expire_in: 1 hour                   # Delete artifacts after 1 hour
  rules:
    # Developer change in app code
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'  # MR only
      changes:
        - app/**/*                      # Any file in app/ directory

# ==================== UNIT TEST STAGE ====================
# TestNG/JUnit unit tests - fast, isolated business logic tests
unit_tests:
  stage: unit_test                   # Assign to 'unit_test' stage
  needs: ["build_app"]               # Wait for build_app job to complete
  script:
    - echo "🧪 Running unit tests"   # Log start
    - cd app                         # Enter app directory
    - mvn -B test                    # Execute TestNG unit tests + reports
    - echo "✅ Unit tests completed"  # Log completion
  artifacts:
    when: always                     # Always save artifacts (success OR failure)
    paths:
      - app/target/surefire-reports/  # JUnit XML reports for GitLab Test Summary
      - app/target/allure-results/    # Allure JSON data for reporting
    reports:
      junit: app/target/surefire-reports/TEST-*.xml  # Parse for GitLab UI
    expire_in: 1 week                 # Keep 7 days for analysis
  rules:
    # Run unit tests only when app changed
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'  # MR only
      changes:
        - app/**/*                       # Any app file change

# ==================== UI TEST STAGE ====================
# Selenium E2E tests - slow, browser-based user journey validation
ui_tests:
  stage: ui_test                     # Assign to 'ui_test' stage
  needs:
    - job: build_app
      optional: true                 # Don't fail if build_app was skipped
  image: selenium/standalone-chrome:latest  # Chrome browser Docker image for Selenium

  services: []                       # No additional Docker services needed

  variables:
    SELENIUM_REMOTE_URL: "http://localhost:4444/wd/hub"  # Selenium Grid endpoint
    APP_BASE_URL: "http://localhost:8080/index.html"     # Static app server URL
    MAVEN_VERSION: "3.9.8"                           # Maven version for this container
    # Override global MAVEN_OPTS so Maven uses a writable repo (e.g. /home/seluser/.m2)
    MAVEN_OPTS: ""                                   # Empty: use default user repo (non-root)

  script:
    - 'echo "Pipeline started for commit ${CI_COMMIT_SHORT_SHA}"'  # Log commit (quoted for YAML)
    - 'echo "Triggered by ${CI_COMMIT_AUTHOR}"'                    # Log author

    - 'echo "📦 Downloading Maven ${MAVEN_VERSION} into the container (no root needed)..."'  # Log Maven download
    - 'export MVN_URL="https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"'  # Maven download URL
    - 'echo "Maven URL: $MVN_URL"'  # Debug URL
    - 'curl -fsSL "$MVN_URL" -o maven.tar.gz'  # Silent download Maven archive

    - 'echo "➡️  File type of maven.tar.gz:"'  # Log verification
    - 'file maven.tar.gz || true'              # Verify download (ignore errors)

    - 'echo "📦 Extracting Maven..."'          # Log extraction
    - 'tar -xzf maven.tar.gz'                  # Extract tar.gz
    - 'export MAVEN_HOME="$PWD/apache-maven-${MAVEN_VERSION}"'  # Set Maven home
    - 'export PATH="$MAVEN_HOME/bin:$PATH"'     # Add to PATH
    - 'mvn -v'                                 # Verify Maven installation

    - 'echo "🌐 Starting simple web server for static UI..."'  # Log server start
    - 'cd app/src/main/resources/static'       # Navigate to static files
    - 'python3 -m http.server 8080 &'          # Start Python HTTP server (background)
    - 'sleep 5'                                # Wait 5s for server startup

    - 'echo "🧪 Running UI tests (Selenium @ ${SELENIUM_REMOTE_URL}, APP_BASE_URL=${APP_BASE_URL})..."'  # Log test start
    - 'cd /builds/$CI_PROJECT_PATH/ui-tests'   # Navigate to UI tests (full GitLab path)
    - 'mvn -B test'                            # Execute Selenium TestNG tests
    - 'echo "✅ UI tests completed"'            # Log completion

  artifacts:
    when: always                              # Save always (success/failure)
    paths:
      - ui-tests/target/surefire-reports/     # JUnit XML for GitLab
      - ui-tests/target/allure-results/       # Allure JSON data
      - ui-tests/target/screenshots/          # Visual failure evidence
    reports:
      junit: ui-tests/target/surefire-reports/TEST-*.xml  # GitLab Test Summary
    expire_in: 1 week                         # 7-day retention

  rules:
    # 1) Developer change in app: run UI tests as well
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/**/*
    # 2) Tester change in automation framework: run UI tests even if app did not change
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ui-tests/**/*

# ==================== ALLURE REPORT STAGE ====================
# Final Test results
generate_allure_report:
  stage: allure_report                  # Final reporting stage
  image: alpine:latest                  # Minimal Alpine Linux (fast startup)
  needs:
    - job: unit_tests
      optional: true                     # OK if unit_tests skipped
    - job: ui_tests
      optional: true                    # OK if ui_tests skipped
  dependencies:
    - unit_tests
    - ui_tests
  before_script:
    - echo "📊 Installing Allure command-line tool..."  # Log Allure setup
    - apk add --no-cache openjdk11-jre curl tar  # Install Java 11 + tools (Alpine packages)
    - curl -o allure-${ALLURE_VERSION}.tgz -Ls https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/${ALLURE_VERSION}/allure-commandline-${ALLURE_VERSION}.tgz  # Download Allure
    - tar -zxvf allure-${ALLURE_VERSION}.tgz -C /opt/  # Extract to /opt
    - ln -s /opt/allure-${ALLURE_VERSION}/bin/allure /usr/bin/allure  # Create symlink
    - allure --version                        # Verify installation
  script:
    - echo "📈 Generating Allure reports..."   # Log start

    # Create directories for combined reports
    - mkdir -p allure-results                 # Staging area for JSON files
    - mkdir -p allure-report                  # Output HTML directory

    # Combine unit test results
    - |
      if [ -d "app/target/allure-results" ]; then  # Check if unit artifacts exist
        echo "✅ Found unit test Allure results"    # Log found
        cp -r app/target/allure-results/* allure-results/ 2>/dev/null || true  # Copy files
      else
        echo "⚠️  No unit test Allure results found"  # Log missing
      fi

    # Combine UI test results
    - |
      if [ -d "ui-tests/target/allure-results" ]; then  # Check if UI artifacts exist
        echo "✅ Found UI test Allure results"           # Log found
        cp -r ui-tests/target/allure-results/* allure-results/ 2>/dev/null || true  # Copy files
      else
        echo "⚠️  No UI test Allure results found"       # Log missing
      fi

    # Generate the Allure report
    - |
      if [ "$(ls -A allure-results)" ]; then      # Check if any results copied
        echo "📊 Generating unified Allure report..."  # Log generation
        allure generate allure-results --clean -o allure-report  # Create HTML dashboard
        echo "✅ Allure report generated successfully"            # Log success
      
        # Create index.html for easy access
        echo "<html><head><meta http-equiv='refresh' content='0; url=allure-report/index.html'></head></html>" > index.html  # Auto-redirect page

    # GENERATE SUREFIRE HTML REPORT
    - |
      if [ -d "app/target/surefire-reports" ]; then
        echo "📊 Generating Surefire HTML report..."
        apk add --no-cache maven  # Install Maven (temporary)
        cd app
        mvn surefire-report:report -DoutputDirectory=../surefire-report
        cd ..
        echo "<html><head><meta http-equiv='refresh' content='0; url=surefire-report/index.html'></head></html>" > surefire-index.html
        echo "✅ Surefire HTML ready!"
      else
        echo "⚠️ No surefire-reports for HTML generation"
      fi
      
        # Print summary
        echo "========================================"
        echo "📊 Allure Report Summary"
        echo "========================================"
        ls -lh allure-report/                   # List generated files
        echo "========================================"
        echo "✅ Report available in artifacts"
        echo "========================================"
      else
        echo "⚠️  No Allure results found to generate report"  # Log no data
      fi
  artifacts:
    when: always                             # Always save reports
    paths:
      - allure-report/                          # Allure HTML
      - index.html                              # Allure entry point
      - app/target/surefire-reports/            # Raw XML
    expire_in: 30 days                       # Keep reports 1 month
    reports:
      junit: app/target/surefire-reports/TEST-*.xml  # Fallback JUnit (if available)
  allow_failure: true                       # ← Runs despite previous failures
  when: always                              # Manual trigger - click "Play" button
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'  # MR only

# ==================== EXTRA: REPORT SUMMARY ====================

print_test_summary:
  stage: allure_report                   # Same stage as Allure (runs in parallel)
  image: alpine:latest                   # Lightweight container
  needs:
    - job: unit_tests
      optional: true                      # OK if skipped
    - job: ui_tests
      optional: true                      # OK if skipped
  script:
    - |
      echo "📊 ========================================"
      echo "📊 Pipeline Execution Summary"
      echo "📊 ========================================"
      echo "Project: Task Management System"
      echo "Commit: ${CI_COMMIT_SHORT_SHA}"
      echo "Author: ${CI_COMMIT_AUTHOR}"
      echo "Pipeline: ${CI_PIPELINE_URL}"
      echo "========================================"
    - |
      if [ -d "app/target/surefire-reports" ]; then  # Check unit test artifacts
        echo "✅ Unit Tests: Completed"
        echo "   Location: app/target/surefire-reports/"
      else
        echo "⚠️  Unit Tests: Skipped or Failed"
      fi
    - |
      if [ -d "ui-tests/target/surefire-reports" ]; then  # Check UI test artifacts
        echo "✅ UI Tests: Completed"
        echo "   Location: ui-tests/target/surefire-reports/"
      else
        echo "⚠️  UI Tests: Skipped or Failed"
      fi
    - |
      echo "========================================"
      echo "📈 Allure Report: Check artifacts"
      echo "========================================"
  when: always                            # Execute regardless of previous failures
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'  # MR only